version: 2

models:
  - name: stg_jooble_jobs
    description: "Staging layer for the Jooble source. Standardizes column names, casts posted_date to a date type, and combines city/country into a location field. No joins or business logic applied at this layer."
    columns:
      - name: title
        description: "Job title as provided by the source."
        tests: [not_null]
      - name: company
        description: "Company name after TRIM + INITCAP standardization."
        tests: [not_null]
      - name: city
        description: "City extracted from the source. May be NULL when the source only reports the country."
      - name: country
        description: "Country extracted from the source."
      - name: location
        description: "Combined city/country string, falling back to country only when city is NULL."
      - name: posted_date
        description: "Date the job was posted, cast from the raw text field."
      - name: employment_type
        description: "Employment type as provided by the source (e.g. Full-time, Part-time, Contract)."
      - name: education
        description: "Minimum education requirement, if stated by the source."
      - name: description
        description: "Full job description text (raw)."
      - name: skills
        description: "Comma-separated list of skills extracted from the job description."
      - name: url
        description: "Original job posting URL."
      - name: source_name
        description: "Hardcoded literal identifying this record's source ('jooble')."

